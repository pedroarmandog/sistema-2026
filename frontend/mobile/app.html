<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport com suporte a safe-areas do iPhone (notch/home bar) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- PWA / Instalação -->
    <meta name="theme-color" content="#0a1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="PetHub" />
    <meta name="application-name" content="PetHub" />
    <meta name="msapplication-TileColor" content="#0a1628" />

    <!-- SEO / Open Graph -->
    <meta
      name="description"
      content="Gestão completa do seu petshop na palma da mão"
    />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/mobile/manifest.json" />

    <!-- Apple Touch Icons (fallback para iOS < 16.4) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/mobile/icons/launchericon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/mobile/icons/launchericon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="/mobile/icons/launchericon-144x144.png"
    />
    <link rel="apple-touch-icon" href="/mobile/icons/launchericon-192x192.png" />

    <!-- Splash screens para iOS (gerados via generate-icons.html) -->
    <!-- iPhone 14 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      href="/mobile/icons/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <!-- iPhone 14 / 13 / 12 -->
    <link
      rel="apple-touch-startup-image"
      href="/mobile/icons/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <!-- iPhone SE / 8 -->
    <link
      rel="apple-touch-startup-image"
      href="/mobile/icons/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    />

    <title>PetHub</title>

    <link rel="stylesheet" href="/mobile/app.css" />
  </head>
  <body>
    <!-- ═══════════════════════════════════════════════════════
       APP SHELL — todo o conteúdo é renderizado pelo JS
       ═══════════════════════════════════════════════════════ -->
    <div id="app" class="app-shell">
      <!-- Splash Screen -->
      <div
        id="splash-screen"
        class="splash-screen"
        role="status"
        aria-label="Carregando PetHub"
      >
        <div class="splash-content">
          <div class="splash-logo-wrap">
            <img
              src="/mobile/icons/launchericon-192x192.png"
              alt="PetHub"
              class="splash-logo-img"
              onerror="this.style.display = 'none'"
            />
            <div class="splash-logo-fallback" aria-hidden="true"></div>
          </div>
          <h1 class="splash-title">PetHub</h1>
          <p class="splash-sub">Gestão inteligente</p>
          <div class="splash-progress">
            <div class="splash-progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- Header (oculto na tela de login) -->
      <header id="app-header" class="app-header" hidden aria-label="Cabeçalho">
        <div class="header-inner">
          <div id="header-content" class="header-left"></div>
          <div class="header-right">
            <button
              id="btn-refresh"
              class="header-btn"
              aria-label="Atualizar"
              title="Atualizar dados"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
            </button>
            <button
              id="btn-notifications"
              class="header-btn"
              aria-label="Notificações"
              title="Notificações"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span
                id="notif-badge"
                class="notif-badge"
                hidden
                aria-hidden="true"
              ></span>
            </button>
          </div>
        </div>
      </header>

      <!-- Área principal de conteúdo — cada página renderiza aqui -->
      <main id="page-content" class="page-content" role="main"></main>

      <!-- Barra de navegação inferior (oculta no login) -->
      <nav
        id="bottom-nav"
        class="bottom-nav"
        hidden
        aria-label="Navegação principal"
      >
        <button
          class="nav-item active"
          data-page="dashboard"
          aria-label="Início"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
          </span>
          <span class="nav-label">Início</span>
        </button>

        <button class="nav-item" data-page="agenda" aria-label="Agenda">
          <span class="nav-icon" aria-hidden="true">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
          </span>
          <span class="nav-label">Agenda</span>
          <span
            id="nav-badge-agenda"
            class="nav-badge"
            hidden
            aria-hidden="true"
          ></span>
        </button>

        <button class="nav-item" data-page="pets" aria-label="Pets">
          <span class="nav-icon" aria-hidden="true">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="4.5" cy="9.5" r="2" />
              <circle cx="9" cy="5.5" r="2" />
              <circle cx="15" cy="5.5" r="2" />
              <circle cx="19.5" cy="9.5" r="2" />
              <path
                d="M12 13c-3.866 0-7 1.791-7 4v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1c0-2.209-3.134-4-7-4z"
              />
            </svg>
          </span>
          <span class="nav-label">Pets</span>
          <span
            id="nav-badge-pets"
            class="nav-badge"
            hidden
            aria-hidden="true"
          ></span>
        </button>

        <button class="nav-item" data-page="financeiro" aria-label="Financeiro">
          <span class="nav-icon" aria-hidden="true">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="1" x2="12" y2="23" />
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
            </svg>
          </span>
          <span class="nav-label">Financeiro</span>
        </button>

        <button
          class="nav-item"
          data-page="configuracoes"
          aria-label="Mais opções"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </span>
          <span class="nav-label">Mais</span>
        </button>
      </nav>

      <!-- Contêiner de Toasts / Notificações inline -->
      <div
        id="toast-container"
        class="toast-container"
        aria-live="polite"
        aria-atomic="false"
      ></div>
    </div>
    <!-- /#app -->

    <!-- ═══════════════════════════════════════════════════════
       SCRIPTS — carregados em ordem de dependência
       ═══════════════════════════════════════════════════════ -->

    <!-- Configuração de URL da API (mesmo do desktop) -->
    <script src="/api-config.js"></script>

    <!-- Serviços (sem dependências externas) -->
    <script src="/mobile/services/api.js"></script>
    <script src="/mobile/services/auth.js"></script>
    <script src="/mobile/services/push.js"></script>

    <!-- Componentes -->
    <script src="/mobile/components/toast.js"></script>
    <script src="/mobile/components/header.js"></script>
    <script src="/mobile/components/bottom-nav.js"></script>

    <!-- Páginas -->
    <script src="/mobile/pages/login.js"></script>
    <script src="/mobile/pages/dashboard.js"></script>
    <script src="/mobile/pages/agenda.js"></script>
    <script src="/mobile/pages/pets.js"></script>
    <script src="/mobile/pages/financeiro.js"></script>
    <script src="/mobile/pages/configuracoes.js"></script>

    <!-- Bootstrap do app (sempre por último) -->
    <script src="/mobile/app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
  </body>
</html>
